name: verify

on:
  push:
    branches: [main]
    # Docs-only changes skip CI entirely (the `database` job alone is ~5 min).
    # Safe today because no status check is required to merge to main
    # (branch protection: required_status_checks is null). If checks are ever
    # made required, remove this filter or add an always-succeeds shim job —
    # a required check that never runs leaves the PR stuck pending.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:fast
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Skip the flaky azure.archive.ubuntu.com mirror
        run: echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      # start applies migrations, but reset also loads the committed fictional
      # seed fixtures required by the database contract tests.
      - run: npx supabase db reset --local
      - run: npm run test:db
