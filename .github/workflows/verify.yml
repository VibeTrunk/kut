name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify docs-only changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/policy/classify-ci-change.mjs --base "$BASE_SHA"

  fast:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run verify:fast
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Skip the flaky azure.archive.ubuntu.com mirror
        run: echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Start the minimal pgTAP/integration stack
        run: npx supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:db
      - name: Run database concurrency suites
        timeout-minutes: 5
        run: npm run test:integration

  migrations:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enforce migration immutability, isolation and test evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/policy/check-migration-policy.mjs --base "$BASE_SHA"

  security:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Reject high-severity production dependency findings
        run: npm audit --omit=dev --audit-level=high

  # Configure this job and gitleaks / scan as required checks after this
  # workflow has landed. Changing branch protection is an external operation
  # and is deliberately not performed by repository code.
  merge-gate:
    if: always()
    needs: [changes, fast, e2e, database, migrations, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete evidence for this change class
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FAST: ${{ needs.fast.result }}
          E2E: ${{ needs.e2e.result }}
          DATABASE: ${{ needs.database.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          test "$FAST" = success
          test "$MIGRATIONS" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$E2E" = skipped
            test "$DATABASE" = skipped
            test "$SECURITY" = skipped
          else
            test "$E2E" = success
            test "$DATABASE" = success
            test "$SECURITY" = success
          fi
          echo "Merge evidence is complete for $GITHUB_SHA."
