name: verify

on:
  push:
    branches: [main]
    # Docs-only changes skip CI entirely (the `database` job alone is ~5 min).
    # Safe today because no status check is required to merge to main
    # (branch protection: required_status_checks is null). If checks are ever
    # made required, remove this filter or add an always-succeeds shim job —
    # a required check that never runs leaves the PR stuck pending.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth: both `setup-node` and the node_modules cache key
  # read this, so the cached tree can never belong to a different Node major.
  NODE_VERSION: '24'

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The flags are what matter here, not a cache: `npm ci` used to take
      # 2m38s-5m02s per job *with* a warm npm cache, because it was making
      # registry round trips for the audit and for metadata revalidation.
      # --prefer-offline --no-audit drops that to 9-12s.
      #
      # A node_modules cache was measured on top of this and removed again:
      # it saved only a further 5-7s of a ~104s run, while costing 140 MB of
      # cache budget and, more importantly, the guarantee `npm ci` gives of
      # a tree rebuilt from the lockfile every time. A cache save that
      # happens on a cancelled or failed run can otherwise pin a partial
      # tree until the lockfile changes.
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run verify:fast
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Skip the flaky azure.archive.ubuntu.com mirror
        run: echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
      # Deliberately NOT cached. Measured on this PR: the step takes 29s with
      # a warm browser cache and 29s without, because `--with-deps` apt work
      # dominates and the browser download never was the cost. A cache here
      # only added a 3s restore and ate 249 MB of the repo cache budget.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Only three of the CLI's fourteen containers are load-bearing here:
      #   postgres     — obviously
      #   storage-api  — its startup migrations create storage.buckets,
      #                  storage.objects and storage.foldername(), all of which
      #                  20260830000000_member_self_service_and_player_directory
      #                  writes to. The base postgres image ships an *empty*
      #                  `storage` schema, so excluding this breaks migrations.
      #   kong         — `supabase start` finishes by reaching the storage API
      #                  through the gateway; without it, start exits non-zero.
      # auth is safe to exclude: auth.users and auth.uid()/role()/email() come
      # from the postgres image itself, not from gotrue.
      #
      # `supabase start` on a fresh volume applies migrations *and* runs
      # supabase/seed.sql ([db.seed] enabled = true), so the previous
      # `supabase db reset --local` step was pure duplicated work. Verified
      # locally against an isolated scratch project on this exact exclude
      # list: 12 files / 398 tests pass with no reset step at all.
      - name: Start only the containers the pgTAP suite needs
        run: npx supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:db
