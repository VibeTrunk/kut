<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FLUT apple-icon master</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&display=block">
<style>
  /* 180 x 180, full bleed: iOS masks the corners itself, so no radius and no transparency. */
  html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; }
  .ground { position: relative; width: 180px; height: 180px; background: radial-gradient(120% 78% at 50% -8%, #221c13 0%, #15130f 46%, #0b0a07 100%); }
  .shield { position: absolute; left: 26px; top: 20px; width: 128px; height: 140px; background: #e0ac4a;
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
  .mark { position: absolute; left: 0; right: 0; top: 86px; text-align: center; font: 900 30px/1 Archivo, sans-serif;
    letter-spacing: -0.6px; color: #1c150a; }
</style>
</head>
<body>
<div class="ground"><div class="shield"></div><div class="mark">FLUT</div></div>
</body>
</html>
