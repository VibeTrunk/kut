<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, 1440</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=Instrument+Serif&amp;display=swap">
<style>
body{margin:0;background:#0b0a07}
a{color:#e0ac4a}a:hover{color:#f2c56a}
.pen{clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);background:#e0ac4a;flex:none;display:block}
.kick{font-weight:800;font-size:11.2px;line-height:1.45;letter-spacing:.26em;text-transform:uppercase;color:#e0ac4a}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:.94;letter-spacing:-.012em}
.field{min-height:48px;width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #4a4030;background:rgb(11 10 7 / 60%);padding:0 16px;font:600 16px Archivo,sans-serif;color:#f4efe3}
</style>
</helmet>
<main style="width:1440px;height:900px;box-sizing:border-box;padding:40px;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 78% at 50% -8%,#221c13 0%,#15130f 46%,#0b0a07 100%);color:#f4efe3;font-family:Archivo,sans-serif">
  <section style="width:448px;display:flex;flex-direction:column;gap:32px">
    <header style="display:flex;flex-direction:column;gap:16px">
      <p style="margin:0 0 8px;display:flex;align-items:center;gap:16px">
        <span class="pen" style="width:70px;height:80px"></span>
        <span style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:40px;font-weight:900;line-height:1;letter-spacing:-.8px">FLUT</span>
          <span class="kick"><span style="display:block">Football League</span><span style="display:block">Ultimate Team</span></span>
        </span>
      </p>
      <h1 class="serif" style="margin:0;font-size:48px">Sign in</h1>
      <p style="margin:0;font-size:16px;line-height:1.625;color:#b3a891">FLUT is private for invited members. Public sign-up is not available.</p>
    </header>
    <p style="margin:0;border-radius:12px;border:1px solid rgb(60 82 48 / 40%);background:rgb(28 36 22 / 50%);padding:16px;font-weight:700;color:#8bbd6c">Your FLUT account is ready. Sign in to continue.</p>
    <form style="display:flex;flex-direction:column;gap:20px">
      <label style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:14px;font-weight:800">Username</span>
        <input class="field" type="text" autocomplete="username">
        <span style="font-size:12px;line-height:1.625;color:#8a8072">Members from before usernames existed can still sign in with their email address here.</span>
      </label>
      <label style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:14px;font-weight:800">Password</span>
        <input class="field" type="password" autocomplete="current-password">
      </label>
      <button type="button" style="min-height:48px;width:100%;border:0;border-radius:12px;background:linear-gradient(to bottom,#eebd63,#d29a34);font:900 16px Archivo,sans-serif;color:#1c150a;box-shadow:0 10px 15px -3px rgb(224 172 74 / 20%)">Sign in</button>
    </form>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
