<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome, 320</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=Instrument+Serif&amp;display=swap">
<style>
body{margin:0;background:#0b0a07}
a{color:#e0ac4a}a:hover{color:#f2c56a}
.pen{clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);background:#e0ac4a;flex:none;display:block}
.kick{font-weight:800;font-size:11.2px;line-height:1.45;letter-spacing:.26em;text-transform:uppercase;color:#e0ac4a}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:.94;letter-spacing:-.012em;text-wrap:balance}
</style>
</helmet>
<main style="width:320px;height:1060px;box-sizing:border-box;padding:20px;background:radial-gradient(120% 78% at 50% -8%,#221c13 0%,#15130f 46%,#0b0a07 100%);color:#f4efe3;font-family:Archivo,sans-serif">
  <section style="display:flex;flex-direction:column;gap:24px;padding-top:20px">
    <header style="display:flex;flex-direction:column;align-items:center;text-align:center">
      <p style="margin:0;font-size:11.2px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:#8a8072">Welcome to</p>
      <p style="margin:14px 0 0;display:flex;flex-direction:column;align-items:center;gap:12px">
        <span class="pen" style="width:44px;height:50px"></span>
        <span style="font-size:48px;font-weight:900;line-height:1;letter-spacing:-1px">FLUT</span>
        <span class="kick"><span style="display:block">Football League</span><span style="display:block">Ultimate Team</span></span>
      </p>
      <h1 class="serif" style="margin:28px 0 0;font-size:48px">Your starter pack is waiting</h1>
    </header>
    <div style="display:flex;flex-direction:column;gap:20px;text-align:center">
      <div style="min-height:352px;box-sizing:border-box;padding:16px;display:grid;place-items:center;border-radius:24px;border:1px solid rgb(224 172 74 / 40%);background:radial-gradient(circle at top,#4a2f08,#15130f 62%)">
        <div>
          <p style="margin:0 auto;width:64px;height:64px;border-radius:999px;border:1px dashed #3a5866;display:grid;place-items:center;font-size:10px;font-weight:700;color:#8fb0c2">seal</p>
          <p style="margin:12px 0 0;font-size:14px;font-weight:900;letter-spacing:.25em;text-transform:uppercase;color:#e0ac4a">Sealed starter pack</p>
        </div>
      </div>
      <p style="margin:0 auto;max-width:448px;font-size:16px;line-height:28px;color:#b3a891">250 FLUT Coins and three Live Cards are already yours — open the pack to meet them.</p>
      <div><button type="button" style="min-height:48px;border:0;border-radius:12px;background:#e0ac4a;padding:12px 24px;font:900 16px Archivo,sans-serif;color:#1c150a">Open your starter pack</button></div>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
